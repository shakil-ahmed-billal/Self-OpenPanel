services:
  openpanel-postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openpanel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-openpanel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  openpanel-redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  openpanel-clickhouse:
    image: openpanel-clickhouse:latest
    build:
      context: ./docker/clickhouse
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: openpanel
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      internal:
        aliases:
          - op-ch

  openpanel-redpanda:
    image: openpanel-redpanda:latest
    build:
      context: ./docker/redpanda
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://openpanel-redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=openpanel-redpanda:33145
      - --smp=1
      - --memory=512M
      - --mode=dev-container
      - --default-log-level=info
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X admin.hosts=localhost:9644 | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  openpanel-api:
    image: openpanel-api:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@openpanel-postgres:5432/openpanel?schema=public
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Running database migrations...'
        cd /app/packages/db && prisma migrate deploy &&
        cd /app/apps/backend && bun run src/main.ts
      "
    depends_on:
      openpanel-postgres:
        condition: service_healthy
      openpanel-redis:
        condition: service_healthy
      openpanel-clickhouse:
        condition: service_healthy
      openpanel-redpanda:
        condition: service_healthy
    environment:
      ROLE: api
      NODE_ENV: production
      SELF_HOSTED: "true"
      AUTOMATIC_MIGRATIONS: "true"
      API_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@openpanel-postgres:5432/${POSTGRES_DB:-openpanel}?schema=public
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@openpanel-postgres:5432/${POSTGRES_DB:-openpanel}?schema=public
      REDIS_URL: redis://openpanel-redis:6379
      CLICKHOUSE_URL: http://openpanel-clickhouse:8123/openpanel
      KAFKA_BROKERS: ${KAFKA_BROKERS:-openpanel-redpanda:9092}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://analytics.naxtbrand.com}
      API_URL: ${API_URL:-https://op-api.naxtbrand.com}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://analytics.naxtbrand.com}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ALLOW_INVITATION: ${ALLOW_INVITATION:-true}
      DISABLE_FAVICON_FETCH: ${DISABLE_FAVICON_FETCH:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
      - dokploy-network

  openpanel-worker:
    image: openpanel-api:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@openpanel-postgres:5432/openpanel?schema=public
    restart: unless-stopped
    depends_on:
      openpanel-api:
        condition: service_healthy
    environment:
      ROLE: worker
      NODE_ENV: production
      SELF_HOSTED: "true"
      AUTOMATIC_MIGRATIONS: "true"
      API_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@openpanel-postgres:5432/${POSTGRES_DB:-openpanel}?schema=public
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@openpanel-postgres:5432/${POSTGRES_DB:-openpanel}?schema=public
      REDIS_URL: redis://openpanel-redis:6379
      CLICKHOUSE_URL: http://openpanel-clickhouse:8123/openpanel
      KAFKA_BROKERS: ${KAFKA_BROKERS:-openpanel-redpanda:9092}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://analytics.naxtbrand.com}
      API_URL: ${API_URL:-https://op-api.naxtbrand.com}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      DISABLE_FAVICON_FETCH: ${DISABLE_FAVICON_FETCH:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  openpanel-dashboard:
    image: openpanel-dashboard:latest
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      openpanel-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SELF_HOSTED: "true"
      PORT: "3000"
      DASHBOARD_URL: ${DASHBOARD_URL:-https://analytics.naxtbrand.com}
      API_URL: ${API_URL:-https://op-api.naxtbrand.com}
      API_URL_SSR: http://openpanel-api:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
      - dokploy-network

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  redpanda_data:

networks:
  internal:
  dokploy-network:
    external: true
